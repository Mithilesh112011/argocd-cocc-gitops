apiVersion: apps/v1
kind: Deployment
metadata:
  name: container-app-1
  labels:
    app: container-app-1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: container-app-1
  template:
    metadata:
      labels:
        app: container-app-1
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret
      containers:
        - name: container-app-1
          image: registry.gitlab.com/<group>/<project>/<image-1>:latest
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
