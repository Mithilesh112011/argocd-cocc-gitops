apiVersion: apps/v1
kind: Deployment
metadata:
  name: ach-manager
  labels:
    app: ach-manager
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ach-manager
  template:
    metadata:
      labels:
        app: ach-manager
    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret

      containers:
        - name: ach-manager
          image: ach-manager # rewritten by images: block in overlay kustomization.yaml
          ports:
            - name: http
              containerPort: 8080

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi

          envFrom:
            - configMapRef:
                name: ach-manager-config

          env:
            - name: DB_HOST
              value: "ach-manager-postgres"

            - name: DB_PORT
              value: "5432"

            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: ach-manager-db-credentials
                  key: dbname

            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: ach-manager-db-credentials
                  key: username

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ach-manager-db-credentials
                  key: password

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ach-manager-postgres
  labels:
    app: ach-manager-postgres

spec:
  replicas: 1

  selector:
    matchLabels:
      app: ach-manager-postgres

  template:
    metadata:
      labels:
        app: ach-manager-postgres

    spec:
      imagePullSecrets:
        - name: gitlab-registry-secret

      containers:
        - name: postgres
          image: postgres:16

          ports:
            - name: postgres
              containerPort: 5432

          env:
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: ach-manager-db-credentials
                  key: dbname

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ach-manager-db-credentials
                  key: username

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ach-manager-db-credentials
                  key: password

          volumeMounts:
            - name: pgdata
              mountPath: /var/lib/postgresql/data
              subPath: pgdata

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi

      volumes:
        - name: pgdata
          persistentVolumeClaim:
            claimName: ach-manager-postgres-pvc

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ach-manager-postgres-pvc

spec:
  accessModes:
    - ReadWriteOnce

  resources:
    requests:
      storage: 10Gi

  # storageClassName: <TODO — confirm gold/silver storage class name with SRE>
