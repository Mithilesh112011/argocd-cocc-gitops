apiVersion: v1
kind: Service
metadata:
  name: ach-manager
  labels:  {app: ach-manager}
spec:
  selector: {app: ach-manager}
    app: ach-manager
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: ach-manager-postgres
  labels: {app: ach-manager-postgres}
spec:
  selector:  {app: ach-manager-postgres}
    app: ach-manager-postgres
  ports:
    - {name: postgres, port: 5432, targetPort: 5432}
 
